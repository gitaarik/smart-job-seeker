services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartjobseeker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${SJS_DB_PORT:-5432}:5432
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    working_dir: /app
    restart: unless-stopped
    ports:
      - ${SJS_APP_PORT:-5173}:5173
    volumes:
      - .:/app
      - /app/node_modules
      - ./db-dumps:/db-dumps:ro
    command: /app/scripts/start-app.sh
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -o /dev/null -s http://localhost:5173/
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 300s
    environment:
      NODE_ENV: development
      DB_RESET: ${DB_RESET:-false}
      DB_RESTORE: ${DB_RESTORE:-false}
      # Override SJS_DATABASE_URL to use direct database connection instead of Prisma Accelerate
      SJS_DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER:-postgres://postgres:postgres@database:5432/smartjobseeker}
      # DATABASE_URL is also set for compatibility with standard Prisma tools
      DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER:-postgres://postgres:postgres@database:5432/smartjobseeker}
  admin:
    extends:
      file: docker-compose.directus.yml
      service: admin
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
  admin-cache:
    extends:
      file: docker-compose.directus.yml
      service: admin-cache
volumes:
  postgres_data:
