services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartjobseeker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/:/scripts
      - ./db-dumps/:/db-dumps
    ports:
      - ${SJS_DB_PORT:-5432}:5432
    command: |
      bash -c "cp /db-dumps/latest.sql /docker-entrypoint-initdb.d/latest.sql 2>/dev/null || true && docker-entrypoint.sh postgres"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    working_dir: /app
    restart: unless-stopped
    ports:
      - ${SJS_APP_PORT:-5173}:5173
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci --ignore-scripts && npx dotenvx run -- prisma generate && npx dotenvx run -- vite dev --host"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -o /dev/null -s http://localhost:5173/
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 300s
    environment:
      NODE_ENV: development
      # Override SJS_DATABASE_URL to use direct database connection instead of Prisma Accelerate
      SJS_DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER}
      # DATABASE_URL is also set for compatibility with standard Prisma tools
      DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER}
      # Override CDP host for Playwright connection (browser-use exposes CDP on 9222)
      SJS_HYBRID_CDP_HOST: browser-use
  admin:
    extends:
      file: docker-compose.directus.yml
      service: admin
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
  admin-cache:
    extends:
      file: docker-compose.directus.yml
      service: admin-cache
  browser-use:
    build: ./browser-use
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${SJS_BROWSER_USE_PORT:-8000}:8000
      - "5900:5900" # VNC port for viewing browser in headed mode
      - "9222:9222" # CDP port for hybrid scraper (Patchright connects here)
    volumes:
      - ./browser-use:/app
      - browser_use_data:/app/data
    environment:
      DISPLAY: ":99" # Tell Playwright to use the VNC-visible display
      SJS_LLM_PROVIDER: ${SJS_LLM_PROVIDER}
      SJS_LLM_API_KEY_GROQ: ${SJS_LLM_API_KEY_GROQ:-}
      SJS_LLM_API_KEY_GEMINI: ${SJS_LLM_API_KEY_GEMINI:-}
      SJS_LLM_API_KEY_OPENAI: ${SJS_LLM_API_KEY_OPENAI:-}
      SJS_LLM_API_KEY_OPENROUTER: ${SJS_LLM_API_KEY_OPENROUTER:-}
      SJS_LLM_API_KEY_DEEPSEEK: ${SJS_LLM_API_KEY_DEEPSEEK:-}
      SJS_LLM_MODEL_GROQ: ${SJS_LLM_MODEL_GROQ:-}
      SJS_LLM_MODEL_GEMINI: ${SJS_LLM_MODEL_GEMINI:-}
      SJS_LLM_MODEL_OPENAI: ${SJS_LLM_MODEL_OPENAI:-}
      SJS_LLM_MODEL_OPENROUTER: ${SJS_LLM_MODEL_OPENROUTER:-}
      SJS_LLM_MODEL_DEEPSEEK: ${SJS_LLM_MODEL_DEEPSEEK:-}
      SJS_LLM_PROVIDER_BROWSER_USE: ${SJS_LLM_PROVIDER_BROWSER_USE}
      SJS_LLM_MODEL_BROWSER_USE: ${SJS_LLM_MODEL_BROWSER_USE:-}
      SJS_BROWSER_USE_TIMEOUT: ${SJS_BROWSER_USE_TIMEOUT:-30000}
      BROWSER_USE_API_KEY: ${SJS_LLM_API_KEY_BROWSER_USE}
      SJS_LOG_LEVEL: ${SJS_BROWSER_USE_LOG_LEVEL:-INFO}
    depends_on:
      - database
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 5
  novnc:
    image: bonigarcia/novnc:1.3.0
    restart: unless-stopped
    ports:
      - "6080:6080"
    environment:
      - AUTOCONNECT=true
      - VNC_PASSWORD=secret
      - VNC_SERVER=browser-use:5900
    depends_on:
      - browser-use
volumes:
  postgres_data:
  browser_use_data:
