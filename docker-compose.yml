services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartjobseeker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/:/scripts
      - ./db-dumps/:/db-dumps
    ports:
      - ${SJS_DB_PORT:-5432}:5432
    command: |
      bash -c "cp /db-dumps/latest.sql /docker-entrypoint-initdb.d/latest.sql 2>/dev/null || true && docker-entrypoint.sh postgres"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    working_dir: /app
    restart: unless-stopped
    ports:
      - ${SJS_APP_PORT:-5173}:5173
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci --ignore-scripts && npx dotenvx run -- prisma generate && npx dotenvx run -- vite dev --host"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -o /dev/null -s http://localhost:5173/
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 300s
    environment:
      NODE_ENV: development
      # Override SJS_DATABASE_URL to use direct database connection instead of Prisma Accelerate
      SJS_DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER}
      # DATABASE_URL is also set for compatibility with standard Prisma tools
      DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER}
  admin:
    extends:
      file: docker-compose.directus.yml
      service: admin
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
  admin-cache:
    extends:
      file: docker-compose.directus.yml
      service: admin-cache
      # Disabled Prisma Studio, because not really using it, because we already
      # have Directus CMS.
      #
      # prisma-studio:
      #   image: node:20
      #   working_dir: /app
      #   ports:
      #     - "5555:5555"
      #   volumes:
      #     - .:/app
      #     - /app/node_modules
      #   command: sh -c "npx prisma studio --port 5555 --browser none"
      #   depends_on:
      #     - database
      #   environment:
      #     DATABASE_URL: 'postgres://postgres:postgres@database:${SJS_DB_PORT}/smartjobseeker'
  browser-use:
    build: ./browser-use
    restart: unless-stopped
    ports:
      - ${SJS_BROWSER_USE_PORT:-8000}:8000
    volumes:
      - ./browser-use:/app
      - browser_use_data:/app/data
    environment:
      SJS_LLM_PROVIDER: ${SJS_LLM_PROVIDER:-groq}
      SJS_GROQ_API_KEY: ${SJS_GROQ_API_KEY}
      SJS_GEMINI_API_KEY: ${SJS_GEMINI_API_KEY}
      SJS_OPENAI_API_KEY: ${SJS_OPENAI_API_KEY}
      SJS_OPENROUTER_API_KEY: ${SJS_OPENROUTER_API_KEY}
      SJS_BROWSER_USE_HEADLESS: ${SJS_BROWSER_USE_HEADLESS:-true}
      SJS_BROWSER_USE_TIMEOUT: ${SJS_BROWSER_USE_TIMEOUT:-30000}
      SJS_LOG_LEVEL: ${SJS_BROWSER_USE_LOG_LEVEL:-INFO}
    depends_on:
      - database
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  browser_use_data:
