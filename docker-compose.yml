services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartjobseeker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${SJS_DB_PORT:-5432}:5432
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    working_dir: /app
    restart: unless-stopped
    ports:
      - 127.0.0.1:${SJS_APP_PORT:-5173}:5173
    volumes:
      - .:/app
      - /app/node_modules
      - ./db-dumps:/db-dumps:ro
      # Persist Patchright browser cache so start-app.sh's install is a no-op
      # after the first download (browser is ~280MB)
      - patchright_cache:/root/.cache/ms-playwright
    command: /app/scripts/start-app.sh
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -o /dev/null -s http://localhost:5173/
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 300s
    environment:
      NODE_ENV: development
      DB_RESET: ${DB_RESET:-false}
      DB_RESTORE: ${DB_RESTORE:-false}
      SJS_DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER:-postgres://postgres:postgres@database:5432/smartjobseeker}
      DATABASE_URL: ${SJS_POSTGRES_URL_DOCKER:-postgres://postgres:postgres@database:5432/smartjobseeker}
      # SMTP2GO for outbound transactional emails
      SJS_SMTP2GO_API_KEY: ${SJS_SMTP2GO_API_KEY:-}
      SJS_EMAIL_FROM: ${SJS_EMAIL_FROM:-}
      # EmailConnect.eu for inbound verification email relay
      SJS_EMAILCONNECT_HMAC_KEY: ${SJS_EMAILCONNECT_HMAC_KEY:-}
      # Encryption key for platform credentials at rest
      SJS_CREDENTIALS_KEY: ${SJS_CREDENTIALS_KEY:-}
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:${SJS_ADMINER_PORT:-8080}:8080
    environment:
      ADMINER_DEFAULT_SERVER: database
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
  patchright_cache:
