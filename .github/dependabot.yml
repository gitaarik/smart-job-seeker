# Dependabot config for smart-job-seeker (open SvelteKit app).
version: 2
updates:
  # --- npm ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # vitest pins its plugins to its own exact version (@vitest/ui 5.0.1
      # requires vitest 5.0.1), so a major that arrives as one PR per package
      # fails npm ci in each of them. Grouped, it arrives as one PR.
      vitest-major:
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 cannot land as a version bump here. svelte-check refuses a
      # bare TS 7 — it requires TypeScript 6 AND 7 installed side by side
      # (`typescript@~6` plus `@typescript/native@npm:typescript@7`) and a
      # `--tsgo` / `--tsgo-experimental-api` flag. That is a migration someone
      # chooses to do, not a dependency update, and until it is done every
      # weekly run re-opens a PR that cannot go green. Minor and patch bumps
      # within TS 5 still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # OpenTelemetry's 3.0 SDK line moves as one or not at all: core and
      # sdk-trace-* 3.x need api 1.10, the 2.x SDK declares api <1.10, and
      # exporter-trace-otlp-http 0.300 needs sdk-trace 3. Langfuse keeps us on
      # 2.x: @langfuse/otel 6.1.1 (2026-11-03) still peers on core ^2 and an
      # exporter <0.300. The minor/patch group offered api 1.10.0 and exporter
      # 0.300.0 beside the 2.x SDK (#96), which npm cannot resolve. Drop these
      # three when Langfuse takes OTel 3.
      - dependency-name: '@opentelemetry/api'
        versions:
          - '>=1.10.0'
      - dependency-name: '@opentelemetry/exporter-trace-otlp-http'
        versions:
          - '>=0.300.0'
      - dependency-name: '@opentelemetry/*'
        update-types:
          - version-update:semver-major

  # --- Docker images ---
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # --- GitHub Actions (active once workflows are added) ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
