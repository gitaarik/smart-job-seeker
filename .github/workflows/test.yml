name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # For the migration check below. Matches the server version dev and
      # preview run, since the thing being checked is DDL behaviour.
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: ./scripts/ci/test.sh
      # Runs in the same job to reuse the install test.sh just did. Gates on
      # the error count, not zero — see the script for why.
      - name: Type check (svelte-check)
        run: ./scripts/ci/check.sh
      # scripts/ sits outside the tsconfig svelte-check uses, so it had no gate
      # at all — which is how 11 scripts kept calling Prisma's API a whole ORM
      # migration later, and how an import of a path that never existed
      # survived. Same count-based ratchet.
      - name: Type check (scripts/)
        run: ./scripts/ci/check-scripts.sh
      # Formatting was unenforced, and three configs disagreed about what it
      # even was — the tree matched none of them. Now that it is at a fixed
      # point, gate it, or it drifts straight back. Format only: eslint is a
      # separate ~1,500-error backlog and is deliberately not run here.
      - name: Formatting (prettier)
        run: npx prettier --check .
      # Third ratchet. eslint has never run in CI and carries ~1,500 errors,
      # almost none auto-fixable, so this gates the count rather than zero. Two
      # of its rules matter more than their count suggests — see the script:
      # no-at-html-tags guards HTML sinks on public pages, and require-each-key
      # catches state mismatches in a UI full of drag-reordering.
      - name: Lint (eslint)
        run: ./scripts/ci/check-lint.sh
      # Builds one database from the migration files and another from
      # schema.ts, then compares them. Catches a migration that cannot run on a
      # fresh database — which is how the history came to be un-runnable in the
      # first place, undetected for four months — and the everyday version:
      # editing schema.ts, pushing to dev, and forgetting to `generate`.
      - name: Migrations build the schema they describe
        run: npx tsx scripts/check-migrations.ts
        env:
          SJS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
