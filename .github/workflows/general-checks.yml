name: General Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install --quiet yamllint==1.37.1
      - run: yamllint .

      # Every tracked shell script: *.sh, and extensionless files with a sh or
      # bash shebang (the git hooks). .shellcheckrc lets it follow `source`.
      # Clean at shellcheck's default severity since 2026-09-26: notes fail too.
      - name: shellcheck
        run: |
          pip install --quiet shellcheck-py==0.11.0.1
          re='^#!.*[/ ](ba|da)?sh( |$)'
          git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            if [[ $f == *.sh ]]; then printf '%s\0' "$f"; continue; fi
            first=''
            IFS= read -r first < "$f" || true
            if [[ $first =~ $re ]]; then printf '%s\0' "$f"; fi
          done | xargs -0 --no-run-if-empty shellcheck

      # The workflows themselves: expressions, action inputs, runner labels,
      # and every run: block through shellcheck, which the step above put on
      # PATH. Clean since 2026-09-26.
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint

  lint-git:
    # Only on PRs — base comparison doesn't make sense for direct pushes to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # PR workflows default to a synthetic merge ref — that would itself
          # be a merge commit and trip the "no base merged in" check. Pin to
          # the actual PR head SHA (content-addressable, can't be spoofed)
          # so the checks see only what the PR contributed.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check for fixup/squash commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          BAD=$(git log --oneline "origin/$BASE_REF..HEAD" --grep '^\(fixup\|squash\)!' || true)
          if [ -n "$BAD" ]; then
            printf '::error::fixup!/squash! commits found — squash them before merge:\n%s\n' "$BAD" >&2
            exit 1
          fi
      - name: Check feature branch is up-to-date with base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_REF" || echo 0)
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Branch is $BEHIND commit(s) behind origin/$BASE_REF — consider rebasing." >&2
          fi
      - name: Check no merge of base into feature branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          MERGES=$(git log --oneline --merges "origin/$BASE_REF..HEAD" \
            --grep "Merge .* into" --grep "Merge branch '$BASE_REF'" || true)
          if [ -n "$MERGES" ]; then
            printf '::error::Merge of %s into feature branch detected — rebase instead:\n%s\n' "$BASE_REF" "$MERGES" >&2
            exit 1
          fi

  # Dockerfile and Dockerfile.production used to be linted only by sjs-ops's
  # recursive hadolint, which pulled every submodule in just to reach them.
  # The check belongs to the repo that owns the files, and this one is public
  # so it costs no Actions minutes.
  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Every Dockerfile this repo tracks, under any name: hadolint-action's
      # recursive mode only finds files named exactly `Dockerfile`, so
      # Dockerfile.production, the one that ships, was never linted.
      # .hadolint.yaml (DL3008, with why) is read from the root. Warnings fail
      # since 2026-09-24; info does not.
      - name: hadolint
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*')
          printf 'hadolint: %s\n' "${files[@]}"
          docker run --rm -v "$PWD:/w:ro" -w /w ghcr.io/hadolint/hadolint:v2.15.0-debian \
            hadolint --failure-threshold warning "${files[@]}"
